version: "2"

linters:
  default: none
  enable:
    - funlen
    - gocognit
    - errcheck
    - errorlint
    - unused
    - govet
    - staticcheck
    - ineffassign
  settings:
    funlen:
      lines: 70
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
  exclusions:
    # One rule per Go package directory as it is today; every linter is
    # excluded for that path. Phase 3 deletes one rule per finished package.
    rules:
      - path: '^cmd/relevo/'
        text: '.*'
      - path: '^dist/'
        text: '.*'
      - path: '^internal/actors/'
        text: '.*'
      - path: '^internal/agentsrc/'
        text: '.*'
      - path: '^internal/chatlabel/'
        text: '.*'
      - path: '^internal/config/'
        text: '.*'
      - path: '^internal/db/'
        text: '.*'
      - path: '^internal/doctor/'
        text: '.*'
      - path: '^internal/e2e/'
        text: '.*'
      - path: '^internal/harness/'
        text: '.*'
      - path: '^internal/history/'
        text: '.*'
      - path: '^internal/hooks/'
        text: '.*'
      - path: '^internal/ingest/'
        text: '.*'
      - path: '^internal/jsonshape/'
        text: '.*'
      - path: '^internal/latency/'
        text: '.*'
      - path: '^internal/ledger/'
        text: '.*'
      - path: '^internal/legacy/'
        text: '.*'
      - path: '^internal/mcp/'
        text: '.*'
      - path: '^internal/migrate/'
        text: '.*'
      - path: '^internal/patch/'
        text: '.*'
      - path: '^internal/pick/'
        text: '.*'
      - path: '^internal/planner/'
        text: '.*'
      - path: '^internal/policy/'
        text: '.*'
      - path: '^internal/proc/'
        text: '.*'
      - path: '^internal/release/'
        text: '.*'
      - path: '^internal/relevo/'
        text: '.*'
      - path: '^internal/remote/[^/]+\.go$'
        text: '.*'
      - path: '^internal/remote/client/'
        text: '.*'
      - path: '^internal/roles/'
        text: '.*'
      - path: '^internal/serve/'
        text: '.*'
      - path: '^internal/setup/'
        text: '.*'
      - path: '^internal/stats/'
        text: '.*'
      - path: '^internal/store/'
        text: '.*'
      - path: '^internal/ui/[^/]+\.go$'
        text: '.*'
      - path: '^internal/ui/dash/'
        text: '.*'
      - path: '^internal/upgrade/'
        text: '.*'
      - path: '^internal/usage/'
        text: '.*'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  tests: true

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes its running CI; main is never cancelled,
# so every commit that lands on main gets a complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs gate: skip heavy CI when a PR only touches docs/plans, specs, or superpowers.
  # See scripts/ci-code-changed.sh for the prefix rules.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "code=true (push to main)"
            exit 0
          fi

          if ! paths=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "code=true (git diff failed)"
            exit 0
          fi

          if [ -z "$paths" ]; then
            count=0
          else
            count=$(printf '%s\n' "$paths" | wc -l | tr -d ' ')
          fi

          code=$(printf '%s\n' "$paths" | sh scripts/ci-code-changed.sh)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code ($count changed paths)"

  check:
    name: check (${{ matrix.os }}, go ${{ matrix.go }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    env:
      # Go < 1.24 does not emit an LC_UUID load command on darwin unless
      # told to, and the current macOS dyld refuses to load a binary
      # without one -- the race-test binary of any package that imports
      # net dies with "dyld: missing LC_UUID load command" before its
      # tests start. -B gobuildid is the opt-in the 1.22/1.23 backports
      # added (golang/go#68678); on 1.24+ it is already the default.
      GOFLAGS: -ldflags=-B=gobuildid
    strategy:
      fail-fast: false
      matrix:
        # ubuntu and macos are the supported platforms; 1.25 is the floor
        # declared in go.mod, and stable catches anything the newest toolchain
        # starts complaining about.
        os: [ubuntu-latest, macos-latest]
        go: ['1.25', 'stable']
        # PRs skip macOS on the 1.25 floor to stay under the free plan's
        # 5-concurrent-macOS-job cap; main still runs the full matrix.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'none' }}
            go: '1.25'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: install shellcheck
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      # The linter is installed only on the leg that must run it, and only that
      # leg requires it (RELEVO_REQUIRE_LINT). CI has no network at test time,
      # so the install is a setup step, not something make check fetches.
      - name: install golangci-lint
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make check
        env:
          RELEVO_REQUIRE_LINT: ${{ matrix.os == 'ubuntu-latest' && matrix.go == 'stable' && '1' || '' }}
          RELEVO_REQUIRE_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.go == 'stable' && '1' || '' }}
        run: make check

  portability:
    name: cross-compile
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # relevo is supported on Linux and macOS only, but the tree must keep
      # compiling elsewhere: this is what catches a platform-specific syscall
      # sneaking back in outside a build-tagged file.
      # CGO_ENABLED=0 because relevo is pure Go: without it a same-GOOS
      # cross-compile (linux/arm64 from linux/amd64) keeps cgo on and reaches
      # for the host's gcc, which cannot target arm64.
      - name: build for every target
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

name: Bug report
description: Something relay does that it should not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: relay only runs the builder harness. If the agent
        itself misbehaves inside its own run, it is probably a harness issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what relay did instead of what you expected.
      placeholder: |
        $ relay send --file plan.md
        relay: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: input
    id: relay-version
    attributes:
      label: relay version
      description: Output of `relay version`.
    validations:
      required: true

  - type: input
    id: harness-version
    attributes:
      label: Harness and version
      description: The builder harness involved and its version (e.g. `claude --version`).

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: "Linux x86_64 / macOS arm64"
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: relay status --json
      description: >-
        If a binding is involved, paste `relay status --json`. Redact paths you
        would rather not share.
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Daemon logs, the round log from `relay log <name>`, screenshots.

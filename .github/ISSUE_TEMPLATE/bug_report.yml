name: Bug report
description: Something relevo does that it should not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: relevo starts builders itself. If a harness CLI misbehaves
        on its own, it is probably that harness's issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what relevo did instead of what you expected.
      placeholder: |
        $ relevo send --file plan.md
        relevo: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: input
    id: relevo-version
    attributes:
      label: relevo version
      description: Output of `relevo version`.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: "Linux x86_64 / macOS arm64"
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: relevo status --json
      description: >-
        If a binding is involved, paste `relevo status --json`. Redact paths you
        would rather not share.
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Daemon logs, the round log from `relevo log <name>`, screenshots.

name: Feature request
description: Something relay should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        relay deliberately makes no judgements — it moves files, types prompts,
        and reports what herdr sees. Whether a report is good, whether work is
        done, whether a question needs a human: those stay with the planner.
        Proposals that ask relay to decide something are likely out of scope.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you doing by hand today, or what goes wrong?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like relay to do
      description: A command, a flag, a behaviour change — as concretely as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including whether an alias override or a wrapper script would do.
